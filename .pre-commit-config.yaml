repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terraform_trivy
        args:
          - --args=--severity=HIGH,CRITICAL
      - id: terraform_docs
        args:
          - --args=--config=.terraform-docs.yml
  - repo: https://github.com/bridgecrewio/checkov
    rev: 3.2.527
    hooks:
      - id: checkov
        args: [--compact, --framework, terraform]
  - repo: local
    hooks:
      - id: tofu-validate-examples
        name: Tofu validate all examples
        description: Runs tofu validate on both example configurations to catch type-inconsistency errors
        language: system
        entry: bash -c 'for ex in examples/simple examples/unmanaged-dns; do tofu -chdir="$ex" init -backend=false && tofu -chdir="$ex" validate; done'
        pass_filenames: false
        files: \.tf$
